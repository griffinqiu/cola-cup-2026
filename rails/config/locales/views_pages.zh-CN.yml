      error_body2: "若仍然失败，清除本站 Cookie（或换用无痕窗口）后再试一次即可；反复不行请联系管理员。"
  pages:
    about:
      lead_heading_html: "不是赌博，<br>\n      <em>是请客</em> 🥤"
      intro_html: "<b style=\"color: var(--hi)\">The Cola of Cup 2026</b>\n      是同事之间的世界杯预测小游戏 —— 赛前预测看好谁，赛后按大家的预测赔率结算。\n      <b style=\"color: var(--hi)\">不涉及真钱</b>，输赢都用饮料：猜错的人给大家买几瓶，仅此而已。"
      credits_heading: "「额度」按饮料兑换"
      credits_sub: "1 额度 = 1 瓶可乐；其他饮料按下方比例兑换"
      drink_cola: "可乐"
      drink_cola_rate: "1 额度 / 瓶"
      drink_tea: "饮料茶"
      drink_tea_rate: "1.5 额度 / 瓶"
      drink_alien: "外星人"
      drink_alien_rate: "1.5 额度 / 瓶"
      drink_redbull: "红牛"
      drink_redbull_rate: "2.5 额度 / 瓶"
      how_heading: "怎么玩"
      rule_predict_html: "<b>赛前预测</b>，选主胜 / 平 / 客胜。小组赛固定 1 瓶；淘汰赛可<b>自选下注瓶数</b>：32/16/8 强 2/3 瓶，半决赛及之后 3/5 瓶。<small>开赛前可随时改或取消预测。</small>"
      rule_lock_html: "<b>开赛前 1 小时锁定</b>，结算赔率以同事预测为准。<small>Polymarket 市场数据全程仅作对比参考。</small>"
      rule_settle_html: "<b>赛后结算</b>：猜中按赔率赢瓶，猜错按注额给大家买饮料。赢瓶以<b>小数累计</b>记在你账上。"
      rule_redeem_html: "<b>额度兑换</b>：去「我的」页面用额度<b>兑换饮料</b> —— 可乐 1、饮料茶/外星人 1.5、红牛 2.5 额度一瓶，兑换后自动扣额度。<b>没额度也能兑</b>，账上会记成负数 —— 输的人照样能喝，赛季结束按最终额度结算（欠的请客补上）。<small>没有平台抽水，额度只在猜对和猜错的人之间流转。</small>"
      rule_multi_html: "<b>想多押？</b>用多个账号参与即可，<b>一人多号不限制</b>。"
