  pages:
    about:
      lead_heading_html: "Not gambling,<br>\n      <em>just buying a round</em> \U0001F964"
      intro_html: |-
        <b style="color: var(--hi)">The Cola of Cup 2026</b>
              is a little World Cup prediction game among coworkers — predict who you like before the match, then settle up afterward by everyone's prediction odds.
              <b style="color: var(--hi)">No real money involved</b> — wins and losses are all in drinks: whoever guesses wrong buys a few bottles for everyone, that's all.
      credits_heading: '"Credits" redeem for drinks'
      credits_sub: 1 credit = 1 bottle of cola; other drinks redeem at the rates below
      drink_cola: Cola
      drink_cola_rate: 1 credit / bottle
      drink_tea: Tea
      drink_tea_rate: 1.5 credits / bottle
      drink_alien: Alien
      drink_alien_rate: 1.5 credits / bottle
      drink_redbull: Red Bull
      drink_redbull_rate: 2.5 credits / bottle
      how_heading: How to play
      rule_predict_html: "<b>Predict before kickoff</b> — pick home win / draw / away win. Group stage is a fixed 1 bottle; in the knockouts you can <b>choose your stake</b>: 2/3 bottles for the Round of 32/16/8, 3/5 bottles from the semifinals on. <small>Change or cancel your prediction anytime before kickoff.</small>"
      rule_lock_html: "<b>Locks 1 hour before kickoff</b>, and settlement odds are based on coworker predictions. <small>Polymarket market data is only ever a comparison reference.</small>"
      rule_settle_html: "<b>Settle after the match</b>: guess right and you win bottles by the odds; guess wrong and you buy everyone drinks by your stake. Bottles won are tallied as <b>decimals</b> in your account."
      rule_redeem_html: "<b>Redeem credits</b>: go to the \"Me\" page and use credits to <b>redeem drinks</b> — cola 1, tea/Alien 1.5, Red Bull 2.5 credits per bottle, automatically deducted on redemption. <b>You can redeem with no credits too</b>, and your account goes negative — losers can still drink, settled at season's end by final credits (pay up what you owe). <small>No platform rake; credits only flow between those who guess right and those who guess wrong.</small>"
      rule_multi_html: "<b>Want to bet more?</b> Just join with multiple accounts — <b>no limit on accounts per person</b>."
