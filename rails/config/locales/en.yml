  leaderboards:
    boards:
      reaper:
        name: Reaper Board
        subtitle: Highest net cola · king of the harvest (redemptions don't affect ranking)
        explainer: Ranked by net cola (bottles won minus bottles lost), high to low. Redeeming drinks just spends your credits and doesn't affect your ranking.
      leek:
        name: Sucker Board
        subtitle: Lowest net cola · harvested the hardest
        explainer: The flip side of the Reaper Board — ranked by net cola from low to high, so whoever lost the most comes first. Only counts people who have made predictions.
      oracle:
        name: Oracle Board
        subtitle: Highest hit rate · Bayesian-weighted, steadier with more matches
        explainer: Ranked by prediction hit rate, but with a "number of matches" correction — guessing a few right on luck isn't enough; you need to be both accurate and prolific to stay steady. Going 1-for-1 won't instantly top the board; it's first discounted toward the overall average hit rate. The more matches you predict, the more your true skill weighs in.
        formula: Bayesian weighting = (hits + 5 × overall average hit rate) ÷ (matches predicted + 5). Open algorithm, same as the IMDB Top 250 weighted rating.
      jinx:
        name: Jinx Board
        subtitle: Back them and they lose · the most reliably wrong
        explainer: The flip side of the Oracle Board — ranked by "miss rate", also with a match-count correction. Missing once or twice doesn't make you a jinx; you need to reliably back losers over enough matches to rank high.
        formula: Wilson score interval lower bound (miss rate, z = 1.96). Open algorithm, same as Reddit comment ranking.
      otaku:
        name: Couch Potato Board
        subtitle: Most cola redeemed · couch-potato bliss
        explainer: Ranked by total credits redeemed, high to low, so the biggest drinker comes first. Only counts people who have redeemed drinks.
