# English. Mirrors the zh-CN key tree (config/locales/zh-CN.yml). Times still
# render in Beijing time; %a/%b resolve to English day/month names.
en:
  time:
    formats:
      day_label: "%a, %b %-d"
      kickoff: "%a %-m/%-d %H:%M"
      snapshot: "%-m/%-d %H:%M"
      reset: "%b %-d, %H:%M"

  format:
    countdown:
      started: "Kicked off"
      days_hours: "%{days}d %{hours}h left"
      hours_minutes: "%{hours}h %{minutes}m left"
      minutes: "%{minutes}m left"
    relative_day:
      today: "Today"
      tomorrow: "Tomorrow"
      yesterday: "Yesterday"
