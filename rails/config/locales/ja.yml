      suspended_body2: 解決方法：状態が正常な別の X アカウントでログインするか、x.com でそのアカウントの停止理由を確認し、解除を申し立ててから再度お越しください。
      rate_limited_heading_html: "ログインが<br><em>一時的に制限</em>されています \U0001F964"
