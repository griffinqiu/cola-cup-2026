      error_body2: それでも失敗する場合は、本サイトの Cookie を削除（またはシークレットウィンドウを使用）して再度お試しください。繰り返し失敗する場合は管理者にお問い合わせください。
  pages:
    about:
      lead_heading_html: "ギャンブルではなく、<br>\n      <em>おごり</em>です \U0001F964"
      intro_html: |-
        <b style="color: var(--hi)">The Cola of Cup 2026</b>
              は同僚同士のワールドカップ予想ゲームです —— 試合前に勝つ方を予想し、試合後はみんなの予想オッズで精算します。
              <b style="color: var(--hi)">本物のお金は使いません</b>。勝ち負けはすべてドリンクで：外した人がみんなに数本おごる、ただそれだけです。
      credits_heading: "「クレジット」でドリンクと引き換え"
      credits_sub: 1クレジット = コーラ1本。他のドリンクは下記の比率で引き換え
      drink_cola: コーラ
      drink_cola_rate: 1クレジット / 本
      drink_tea: お茶系ドリンク
      drink_tea_rate: 1.5クレジット / 本
      drink_alien: エイリアン
      drink_alien_rate: 1.5クレジット / 本
      drink_redbull: レッドブル
      drink_redbull_rate: 2.5クレジット / 本
      how_heading: 遊び方
      rule_predict_html: "<b>試合前に予想</b>し、ホーム勝ち / 引き分け / アウェイ勝ちを選びます。グループステージは固定1本。ノックアウト戦は<b>賭ける本数を選べます</b>：ベスト32/16/8 は 2/3 本、準決勝以降は 3/5 本。<small>試合開始前ならいつでも変更・取り消しできます。</small>"
      rule_lock_html: "<b>試合開始1時間前にロック</b>。精算オッズは同僚の予想を基準とします。<small>Polymarket の市場データは全期間を通じて比較参考のみです。</small>"
      rule_settle_html: "<b>試合後に精算</b>：的中ならオッズに応じて本数を獲得、外したら賭けた分だけみんなにドリンクをおごります。獲得本数は<b>小数で累計</b>してあなたの口座に記録されます。"
      rule_redeem_html: "<b>クレジット引き換え</b>：「マイページ」でクレジットを使い<b>ドリンクと引き換え</b> —— コーラ1、お茶系ドリンク/エイリアン 1.5、レッドブル 2.5 クレジットで1本、引き換え後は自動でクレジットが差し引かれます。<b>クレジットがなくても引き換え可能</b>で、口座はマイナスとして記録されます —— 負けた人もちゃんと飲めて、シーズン終了時に最終クレジットで精算します（借りた分はおごって清算）。<small>プラットフォームの手数料はなく、クレジットは当てた人と外した人の間でのみやり取りされます。</small>"
      rule_multi_html: "<b>もっと賭けたい？</b>複数アカウントで参加すればOK、<b>一人で複数アカウントも制限なし</b>。"
