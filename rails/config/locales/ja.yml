    boards:
      reaper:
        name: 狩り取りランキング
        subtitle: コーラ純得点トップ · 収穫の王（引き換えは順位に影響しません）
        explainer: コーラ純得点（勝った本数から負けた本数を引いた数）の高い順に並べます。ドリンクの引き換えはクレジットを使うだけで、順位には影響しません。
      leek:
        name: カモランキング
        subtitle: コーラ純得点が最も低い · もっとも刈られた人
        explainer: 狩り取りランキングの裏返し。コーラ純得点の低い順に並べ、最も負けた人が一番上に来ます。予想に参加したことのある人のみが対象です。
      oracle:
        name: 予言者ランキング
        subtitle: 的中率トップ · ベイズ加重、試合数が多いほど安定
        explainer: 予想の的中率で順位を付けますが、「試合数」の補正をかけています。運だけで数試合当てても不十分で、正確かつ多くこなしてこそ安定します。1試合だけ全的中でも即座に首位にはならず、まず全体平均の的中率で割り引かれます。予想した試合数が多いほど、あなたの実力が反映される割合が高くなります。
        formula: ベイズ加重 =（的中数 + 5 × 全体平均的中率）÷（予想試合数 + 5）。公開アルゴリズム、IMDB Top 250 の加重評価と同じです。
      jinx:
        name: 逆神ランキング
        subtitle: 押せば外れる · もっとも安定して外す人
        explainer: 予言者ランキングの裏返し。「外し率」で順位を付け、同様に試合数の補正をかけています。たまに1〜2回外しただけでは逆神とは言えず、安定して押せば外れ、かつ試合数が十分でこそ上位に入ります。
        formula: Wilson 信頼区間の下限（外し率、z = 1.96）。公開アルゴリズム、Reddit のコメント並べ替えと同じです。
      otaku:
        name: ぐうたらランキング
        subtitle: コーラの引き換え最多 · ぐうたらの幸せ
        explainer: 引き換えたクレジットの累計が多い順に並べ、最も飲んだぐうたらが一番上に来ます。ドリンクを引き換えたことのある人のみが対象です。
