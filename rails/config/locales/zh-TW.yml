  leaderboards:
    boards:
      reaper:
        name: 鐮刀榜
        subtitle: 可樂淨分最高 · 收割之王（兌換不影響排名）
        explainer: 按可樂淨分（贏的瓶數減去輸的瓶數）從高到低排名。兌換飲料只是花掉額度，不影響排名。
      leek:
        name: 韭菜榜
        subtitle: 可樂淨分最低 · 被割得最慘
        explainer: 鐮刀榜的反面：按可樂淨分從低到高排，輸得最慘的排最前。只統計參與過預測的人。
      oracle:
        name: 神預榜
        subtitle: 命中率最高 · 貝氏加權，場數越多越穩
        explainer: 按預測命中率排名，但做了「場數」修正：光靠手氣猜中幾場不夠，要又準又多才穩。只猜 1 場全中不會直接霸榜，會先按全場平均命中率打個折；預測場數越多，你的真實水準占比越高。
        formula: 貝氏加權 =（命中數 + 5 × 全場平均命中率）÷（預測場數 + 5），公開演算法，同 IMDB Top 250 加權評分。
      jinx:
        name: 毒奶榜
        subtitle: 押誰誰輸 · 最穩定押錯的人
        explainer: 神預榜的反面：按「押錯率」排名，同樣做了場數修正。偶爾押錯一兩次不算毒奶，要穩定地押誰誰輸、且場數夠多，才能名列前茅。
        formula: Wilson 置信區間下界（押錯率，z = 1.96），公開演算法，同 Reddit 評論排序。
      otaku:
        name: 肥宅榜
        subtitle: 可樂兌換最多 · 肥宅快樂
        explainer: 按累計兌換的額度從高到低排名，喝得最多的肥宅排最前。只統計兌換過飲料的人。
