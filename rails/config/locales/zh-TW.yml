      rule_redeem_html: "<b>額度兌換</b>：去「我的」頁面用額度<b>兌換飲料</b> —— 可樂 1、飲料茶/外星人 1.5、紅牛 2.5 額度一瓶，兌換後自動扣額度。<b>沒額度也能兌</b>，帳上會記成負數 —— 輸的人照樣能喝，賽季結束按最終額度結算（欠的請客補上）。<small>沒有平台抽水，額度只在猜對和猜錯的人之間流轉。</small>"
