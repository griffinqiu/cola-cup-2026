      rule_predict_html: "<b>賽前預測</b>，選主勝 / 平 / 客勝。小組賽固定 1 瓶；淘汰賽可<b>自選下注瓶數</b>：32/16/8 強 2/3 瓶，準決賽及之後 3/5 瓶。<small>開賽前可隨時改或取消預測。</small>"
